name: Paper trace review
on:
  pull_request:
    paths: ['.github/workflows/paper-trace-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence-2
          run-id: 38233978513
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Summarize recorded paper geometry and screenshot pixels
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, io
          from pathlib import Path
          from PIL import Image
          roots = list(Path('evidence').rglob('designer-pages-page-proper-*'))
          if len(roots) != 1: raise RuntimeError(f'Expected one failure directory, got {len(roots)}')
          root = roots[0]
          for p in root.glob('*.md'): print('CONTEXT', p.read_text()[:5000])
          for p in root.glob('*.png'):
              image = Image.open(p).convert('RGB')
              print('SCREENSHOT', p.name, image.size)
              for y in (300, 450, 550, 600, 650, 700, 750, 800, 850):
                  if y < image.height:
                      print('PIXELS', y, [(x, image.getpixel((x,y))) for x in (250,400,600,700,850,1000,1100) if x < image.width])
          def decode(v):
              if isinstance(v, list): return [decode(x) for x in v]
              if not isinstance(v, dict): return v
              if 'o' in v and isinstance(v['o'], list): return {e['k']:decode(e['v']) for e in v['o']}
              if 'a' in v: return decode(v['a'])
              if len(v)==1:
                  for k in ('s','n','b'): 
                      if k in v: return v[k]
                  if v.get('v') in ('null','undefined'): return None
              return {k:decode(x) for k,x in v.items()}
          fields = ['FullPaper','DesignPaperHeight','SourcePaperHeight','Zoom','RenderCount','DesignLayoutBuilds','SnapshotSequence','Preferences','PreferencesLoaded','PreferencesPending','Status','SidebarWidth','VisibleSidebarWidth']
          with zipfile.ZipFile(root/'trace.zip') as z:
              for name in z.namelist():
                  if not name.endswith('.trace'): continue
                  last = None; count=0
                  for line in z.read(name).decode().splitlines():
                      event=json.loads(line)
                      if event.get('type') == 'console' and event.get('messageType') == 'error': print('CONSOLE_ERROR',str(event)[:3000])
                      if event.get('type') == 'after' and 'result' in event:
                          result=decode(event['result'])
                          candidates=[result]
                          if isinstance(result,dict): candidates += list(result.values())
                          for state in candidates:
                              if not isinstance(state,dict) or 'FullPaper' not in state: continue
                              concise={k:state.get(k) for k in fields if k in state}
                              for k in ('show-full-paper','design-zoom','page-tab-0'):
                                  concise[k]=state.get('Commands',{}).get(k)
                              concise['Objects']=state.get('Objects',[])[:1]
                              if concise != last:
                                  print('STATE',json.dumps(concise,ensure_ascii=False)); count+=1; last=concise
                      if event.get('type')=='after' and event.get('error'): print('ERROR',str(event)[:5000])
                  print('STATE_COUNT',name,count)
          PY
