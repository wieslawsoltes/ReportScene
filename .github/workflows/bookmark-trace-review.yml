name: Bookmark trace review
on:
  pull_request:
    paths: ['.github/workflows/bookmark-trace-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence-7
          run-id: 38266796860
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Print failed outline context and last recorded native state
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          def decode(v):
              if isinstance(v,list): return [decode(x) for x in v]
              if not isinstance(v,dict): return v
              if 'o' in v and isinstance(v['o'],list): return {e['k']:decode(e['v']) for e in v['o']}
              if 'a' in v: return decode(v['a'])
              if len(v)==1:
                  for k in ('s','n','b'):
                      if k in v: return v[k]
                  if v.get('v') in ('null','undefined'): return None
              return {k:decode(x) for k,x in v.items()}
          for root in Path('evidence').rglob('preview-outline-*'):
              if not (root/'trace.zip').exists(): continue
              print('FAILURE',root.name)
              for path in root.glob('*.md'): print('CONTEXT',path.read_text()[:8000])
              with zipfile.ZipFile(root/'trace.zip') as z:
                  last=None
                  for name in z.namelist():
                      if not name.endswith('.trace'): continue
                      for line in z.read(name).decode().splitlines():
                          event=json.loads(line)
                          if event.get('type')=='console' and event.get('messageType')=='error': print('CONSOLE_ERROR',str(event)[:2000])
                          if event.get('type')!='after' or 'result' not in event: continue
                          result=decode(event['result']); candidates=[result]
                          if isinstance(result,dict): candidates+=list(result.values())
                          for state in candidates:
                              if isinstance(state,dict) and 'PreviewBookmarkCount' in state: last=state
                  if last is not None:
                      print('STATE', json.dumps({k:v for k,v in last.items() if k.startswith('Preview') or k in ('Zoom','Status','Diagnostics')},ensure_ascii=False))
                      print('COMMANDS',json.dumps({k:v for k,v in last.get('Commands',{}).items() if k.startswith('preview-')},ensure_ascii=False))
                      print('INPUTS',json.dumps({k:v for k,v in last.get('Inputs',{}).items() if k.startswith('preview-')},ensure_ascii=False))
          PY
