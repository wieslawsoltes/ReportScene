name: Developer source inspection
on:
  pull_request:
    paths: ['.github/workflows/developer-export.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source and public history only
        shell: bash
        run: |
          mkdir -p inspection
          git archive --format=zip HEAD -o inspection/source.zip
          git bundle create inspection/history.bundle --all
          git rev-parse HEAD HEAD^{tree} > inspection/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: developer-source-inspection
          path: inspection
          retention-days: 3
