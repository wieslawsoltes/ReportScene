name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webgpu-shader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser shader validation runtime
        run: |
          npm ci --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Compile and render WGSL on software WebGPU
        run: node --test tests/browser/webgpu-shader.test.mjs
      - name: Validate benchmark contracts and software timing paths
        working-directory: tests/browser
        run: |
          npm run test:benchmark
          npm run benchmark:webgpu -- --software --workloads shapes,glyphs,images,mixed --instances 128 --width 640 --height 480 --warmup 2 --samples 3 --repeats 1 --timestamps auto --timeout-ms 120000 --output benchmark-evidence/offscreen
          npm run benchmark:webgpu -- --software --workloads mixed --instances 128 --width 320 --height 240 --warmup 1 --samples 3 --repeats 1 --timestamps off --target canvas --uploads none --batch-limit 1 --timeout-ms 120000 --output benchmark-evidence/canvas
      - name: Compare shader variants and baseline controls on the same device
        run: |
          mkdir -p artifacts/benchmark-baselines
          git show 22939aadd71c26917ce9fb7911be5467dcc76eaf:src/ReportScene.Rendering.WebGpu/Shaders/Report2D.wgsl > artifacts/benchmark-baselines/Report2D.22939aa.wgsl
          cd tests/browser
          npm run benchmark:webgpu -- --software --baseline-shader ../../artifacts/benchmark-baselines/Report2D.22939aa.wgsl --workloads shapes,glyphs,images,mixed,diagonal-lines --instances 64 --width 640 --height 480 --warmup 4 --samples 12 --repeats 4 --timestamps auto --uploads none --timeout-ms 300000 --output benchmark-evidence/comparison-main
      - name: Compare the ellipse control with bounded software raster work
        working-directory: tests/browser
        run: npm run benchmark:webgpu -- --software --baseline-shader ../../artifacts/benchmark-baselines/Report2D.22939aa.wgsl --workloads ellipse-strokes --instances 16 --width 640 --height 480 --warmup 4 --samples 12 --repeats 4 --timestamps auto --uploads none --timeout-ms 300000 --output benchmark-evidence/comparison-ellipses
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-shader-validation
          path: tests/browser/shader-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-benchmark-smoke
          path: tests/browser/benchmark-evidence
          if-no-files-found: error
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record tested source revision
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/ReportScene-source.zip
          git rev-parse HEAD HEAD^{tree} > artifacts/source-revision.txt
          sha256sum artifacts/ReportScene-source.zip > artifacts/source.sha256
      - name: Build and run conformance suite
        run: |
          mkdir -p artifacts
          dotnet run --project tests/ReportScene.Tests -c Release 2>&1 | tee artifacts/conformance.log
      - name: Record differential performance evidence
        run: dotnet run --project tests/ReportScene.Benchmarks -c Release 2>&1 | tee artifacts/performance.log
      - name: Build and consume reusable core packages
        run: bash scripts/pack-core.sh 2>&1 | tee artifacts/packages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: artifacts
          if-no-files-found: error
  desktop:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: core-validation
          path: artifacts/core-input
      - name: Build Uno 7 desktop application and WebGPU libraries
        run: dotnet build apps/ReportScene.App -c Release -f net10.0-desktop -p:ReportSceneTargetFramework=net10.0-desktop
      - name: Pack and consume Uno libraries
        run: bash scripts/pack-uno.sh 2>&1 | tee artifacts/uno-packages.log
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages
          path: |
            artifacts/packages
            artifacts/uno-packages.log
          if-no-files-found: error
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish actual Uno WebAssembly application once
        run: |
          dotnet publish apps/ReportScene.App -c Release -f net10.0-browserwasm -p:ReportSceneTargetFramework=net10.0-browserwasm -p:WasmShellWebAppBasePath=/ReportScene/ -o artifacts/wasm
          python3 scripts/stage-browser.py artifacts/wasm artifacts/site artifacts/testsite/ReportScene
      - uses: actions/upload-artifact@v4
        with:
          name: browser-app
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/site
  browser-shard:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          path: artifacts/testsite/ReportScene
      - name: Install and validate browser inspection dependencies
        run: |
          npm ci --prefix tests/browser
          npm run test:pixels --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Test WebGPU rendering and native input with software Vulkan
        run: |
          python3 -m http.server 8000 --directory artifacts/testsite > artifacts/http.log 2>&1 &
          cd tests/browser
          npx playwright test --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            tests/browser/test-results
            artifacts/http.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/browser/blob-report
          if-no-files-found: error
  browser:
    needs: browser-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: tests/browser/all-blob-reports
      - name: Require all eight shards and merge their results
        run: |
          test "$(find tests/browser/all-blob-reports -name '*.zip' | wc -l)" -eq 8
          npm ci --prefix tests/browser
          cd tests/browser
          npx playwright merge-reports --config=merge.config.mjs all-blob-reports
          node verify-merged-results.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            tests/browser/playwright-report
            tests/browser/merged-results.json
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, desktop, browser, webgpu-shader]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy tested application
        id: deployment
        uses: actions/deploy-pages@v4
