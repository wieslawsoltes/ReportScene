name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run conformance suite
        run: dotnet run --project tests/ReportScene.Tests -c Release
      - name: Build reusable packages
        run: |
          for project in src/ReportScene.Model src/ReportScene.Expressions src/ReportScene.Data src/ReportScene.Engine src/ReportScene.Serialization src/ReportScene.Designer src/ReportScene.Rendering.Skia src/ReportScene.Export src/ReportScene.Samples; do
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: core-packages
          path: artifacts/packages
