name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record tested source revision
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/ReportScene-source.zip
          git rev-parse HEAD HEAD^{tree} > artifacts/source-revision.txt
          sha256sum artifacts/ReportScene-source.zip > artifacts/source.sha256
      - name: Build and run conformance suite
        run: |
          mkdir -p artifacts
          dotnet run --project tests/ReportScene.Tests -c Release 2>&1 | tee artifacts/conformance.log
      - name: Record differential performance evidence
        run: dotnet run --project tests/ReportScene.Benchmarks -c Release 2>&1 | tee artifacts/performance.log
      - name: Build and consume reusable core packages
        run: bash scripts/pack-core.sh 2>&1 | tee artifacts/packages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-validation
          path: artifacts
          if-no-files-found: error
  desktop:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: core-validation
          path: artifacts/core-input
      - name: Build desktop application and reusable Uno controls
        run: dotnet build apps/ReportScene.App -c Release -f net10.0-desktop -p:ReportSceneTargetFramework=net10.0-desktop
      - name: Pack and consume Uno libraries
        run: bash scripts/pack-uno.sh 2>&1 | tee artifacts/uno-packages.log
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages
          path: |
            artifacts/packages
            artifacts/uno-packages.log
          if-no-files-found: error
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish actual Uno WebAssembly application once
        run: |
          dotnet publish apps/ReportScene.App -c Release -f net10.0-browserwasm -p:ReportSceneTargetFramework=net10.0-browserwasm -p:WasmShellWebAppBasePath=/ReportScene/ -o artifacts/wasm
          python3 scripts/stage-browser.py artifacts/wasm artifacts/site artifacts/testsite/ReportScene
      - uses: actions/upload-artifact@v4
        with:
          name: browser-app
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/site
  browser-shard:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # More isolated machines, not more workers sharing a software-GPU process.
      # Every scenario still runs once; all eight reports are required below.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: browser-app
          path: artifacts/testsite/ReportScene
      - name: Install browser test dependencies
        run: |
          npm install --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Test the shared published build with native input
        run: |
          python3 -m http.server 8000 --directory artifacts/testsite > artifacts/http.log 2>&1 &
          cd tests/browser
          npx playwright test --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            tests/browser/test-results
            artifacts/http.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/browser/blob-report
          if-no-files-found: error
  browser:
    needs: browser-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: tests/browser/all-blob-reports
      - name: Require all eight shards and merge their results
        run: |
          test "$(find tests/browser/all-blob-reports -name '*.zip' | wc -l)" -eq 8
          npm install --prefix tests/browser
          cd tests/browser
          npx playwright merge-reports --config=merge.config.mjs all-blob-reports
          node verify-merged-results.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            tests/browser/playwright-report
            tests/browser/merged-results.json
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, desktop, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy tested application
        id: deployment
        uses: actions/deploy-pages@v4
