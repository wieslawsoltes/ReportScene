name: Developer snapshot
on:
  workflow_dispatch:
  push:
    branches: [feat/subreports]
    paths: [.github/workflows/developer-snapshot.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preserve tracked source and history
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
          git bundle create artifacts/history.bundle --all
      - name: Restore core dependencies
        run: dotnet restore tests/ReportScene.Tests
      - name: Package an offline core build environment
        run: |
          sdk=$(dotnet --version)
          runtime=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ { print $2 }' | sort -V | tail -1)
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          mkdir -p "$RUNNER_TEMP/offline/dotnet" "$RUNNER_TEMP/offline/packages"
          tar -C "$root" -cf - dotnet LICENSE.txt ThirdPartyNotices.txt host/fxr/"$runtime" shared/Microsoft.NETCore.App/"$runtime" sdk/"$sdk" packs/Microsoft.NETCore.App.Ref packs/Microsoft.NETCore.App.Host.linux-x64 | tar -C "$RUNNER_TEMP/offline/dotnet" -xf -
          find "$HOME/.nuget/packages" -name '*.nupkg' -exec cp {} "$RUNNER_TEMP/offline/packages/" \;
          tar -C "$RUNNER_TEMP/offline" -czf artifacts/core-tools.tar.gz dotnet packages
      - uses: actions/upload-artifact@v4
        with:
          name: developer-snapshot
          path: artifacts
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
